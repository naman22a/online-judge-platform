name: Update Kubernetes Manifests

on:
  workflow_call:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Kubernetes image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          declare -A SERVICES=(
            [api-gateway]="api-gateway"
            [auth]="auth-service"
            [users]="users-service"
            [problems]="problems-service"
            [tags]="tags-service"
            [companies]="companies-service"
            [submissions]="submissions-service"
            [execution]="execution-service"
            [client]="client"
          )

          declare -A MANIFESTS=(
            [api-gateway]="k8s/apps/api-gateway/api-gateway-deployment.yml"
            [auth]="k8s/apps/auth/auth-deployment.yml"
            [users]="k8s/apps/users/users-deployment.yml"
            [problems]="k8s/apps/problems/problems-deployment.yml"
            [tags]="k8s/apps/tags/tags-deployment.yml"
            [companies]="k8s/apps/companies/companies-deployment.yml"
            [submissions]="k8s/apps/submissions/submissions-deployment.yml"
            [execution]="k8s/apps/execution/execution-deployment.yml"
            [client]="k8s/apps/client/client-deployment.yml"
          )

          for app in "${!SERVICES[@]}"; do
            service="${SERVICES[$app]}"
            manifest="${MANIFESTS[$app]}"
            image="${DOCKER_USERNAME}/leetcode-${service}"

            echo "Updating ${app}"
            echo "  Manifest: ${manifest}"
            echo "  Image:    ${image}:${IMAGE_TAG}"

            if [ ! -f "$manifest" ]; then
              echo "ERROR: Manifest not found: $manifest"
              exit 1
            fi

            sed -i -E \
              "s|^([[:space:]]*image:[[:space:]]*)${image}:.*|\1${image}:${IMAGE_TAG}|" \
              "$manifest"
          done

      - name: Show manifest changes
        run: |
          git diff -- k8s/apps

      - name: Commit manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/apps

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "chore(gitops): update images to ${GITHUB_SHA}"

          git push
