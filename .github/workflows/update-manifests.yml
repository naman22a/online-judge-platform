name: Update Kubernetes Manifests

on:
  workflow_call:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          declare -A SERVICES=(
            [api-gateway]="api-gateway"
            [users]="users-service"
            [auth]="auth-service"
            [problems]="problems-service"
            [tags]="tags-service"
            [companies]="companies-service"
            [submissions]="submissions-service"
            [execution]="execution-service"
            [client]="client"
          )

          for app in "${!SERVICES[@]}"; do
            service="${SERVICES[$app]}"
            manifest="k8s/apps/${app}/deployment.yml"

            if [ ! -f "$manifest" ]; then
              echo "Skipping ${app}: ${manifest} not found"
              continue
            fi

            image="${DOCKER_USERNAME}/leetcode-${service}"

            echo "Updating ${manifest}"
            echo "  ${image}:${IMAGE_TAG}"

            sed -i -E \
              "s|image: ${image}:.*|image: ${image}:${IMAGE_TAG}|" \
              "$manifest"
          done

      - name: Commit manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/apps

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "chore(gitops): update images to ${GITHUB_SHA}"

          git push
