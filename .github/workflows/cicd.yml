name: CI CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'assets/**/*.*'

jobs:
    # CI
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    secrets-scan:
        uses: ./.github/workflows/secrets-scan.yml
        secrets: inherit

    dependency-scan:
        uses: ./.github/workflows/dependency-scan.yml

    docker-scan:
        uses: ./.github/workflows/docker-lint.yml

    docker-build-test-and-push:
      needs: [code-quality, secrets-scan, dependency-scan, docker-scan]
      uses: ./.github/workflows/docker-build-test-and-push.yml
      secrets: inherit

    docker-build-and-push-client:
      needs: [code-quality, secrets-scan, dependency-scan, docker-scan]
      uses: ./.github/workflows/docker-build-push-client.yml
      secrets: inherit

    update-manifests:
      needs: [docker-build-test-and-push, docker-build-and-push-client]
      uses: ./.github/workflows/update-manifests.yml
      secrets: inherit

    # CD now handled via ArgoCD
