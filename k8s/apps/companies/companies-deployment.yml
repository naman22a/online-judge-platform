apiVersion: apps/v1
kind: Deployment
metadata:
  name: companies-deployment
  namespace: oj
spec:
  selector:
    matchLabels:
      app: companies
  template:
    metadata:
      labels:
        app: companies
    spec:
      containers:
      - name: companies-backend
        image: naman22a/leetcode-companies-service:2e603318006b84dc18238c3a7a48934e2cf7d20e
        imagePullPolicy: Always
        ports:
        - containerPort: 5005
        envFrom:
        - secretRef:
            name: oj-env
