apiVersion: apps/v1
kind: Deployment
metadata:
  name: tags-deployment
  namespace: oj
spec:
  selector:
    matchLabels:
      app: tags
  template:
    metadata:
      labels:
        app: tags
    spec:
      containers:
      - name: tags-backend
        image: naman22a/leetcode-tags-service:b58372c2052de70a4adc6f1eea204c6ce6274509
        imagePullPolicy: Always
        ports:
        - containerPort: 5004
        envFrom:
        - secretRef:
            name: oj-env
