apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
  namespace: oj
spec:
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
      - name: users-backend
        image: naman22a/leetcode-users-service:2e603318006b84dc18238c3a7a48934e2cf7d20e
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
        envFrom:
        - secretRef:
            name: oj-env
