apiVersion: apps/v1
kind: Deployment
metadata:
  name: problems-deployment
  namespace: oj
spec:
  selector:
    matchLabels:
      app: problems
  template:
    metadata:
      labels:
        app: problems
    spec:
      containers:
      - name: problems-backend
        image: naman22a/leetcode-problems-service:2e603318006b84dc18238c3a7a48934e2cf7d20e
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        envFrom:
        - secretRef:
            name: oj-env
