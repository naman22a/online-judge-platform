apiVersion: apps/v1
kind: Deployment
metadata:
  name: problems-deployment
  namespace: oj
spec:
  selector:
    matchLabels:
      app: problems
  template:
    metadata:
      labels:
        app: problems
    spec:
      containers:
      - name: problems-backend
        image: naman22a/leetcode-problems-service:b58372c2052de70a4adc6f1eea204c6ce6274509
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        envFrom:
        - secretRef:
            name: oj-env
